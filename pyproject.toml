[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnipdf"
version = "0.1.0"
description = "Local Universal PDF-to-Markdown Converter with Smart Per-Page Routing"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Minha" }
]
dependencies = [
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "pillow>=10.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
deep = [
    "docling>=2.0.0",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "aiosqlite>=0.20.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
omnipdf = "omnipdf.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/omnipdf"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "pymupdf",
    "pymupdf.*",
    "fitz",
    "fitz.*",
    "pymupdf4llm",
    "pymupdf4llm.*",
    "PIL",
    "PIL.*",
    "docling",
    "docling.*",
    "sse_starlette",
    "sse_starlette.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
disallow_untyped_calls = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
